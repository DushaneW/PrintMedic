name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check printmedic tests
      - name: Type check (mypy)
        if: runner.os == 'Windows'   # os.startfile and the WSD/PowerShell bridge are Windows-typed
        run: python -m mypy
      - name: Tests
        # The read-only real-system test needs a Windows print spooler; hosted runners have one.
        run: python -m pytest -q -rs

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[package]"
      - run: pyinstaller --noconfirm packaging/printmedic.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PrintMedic-windows
          path: dist/PrintMedic
          retention-days: 7
